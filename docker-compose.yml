# Two services, both built from the same image, plus MongoDB for the API.
#
#   docker compose up
#     -> runs the full pipeline once and prints the summary to stdout.
#        No API key. No network. Matches the fresh-clone / no-key path
#        verified in step 5.
#
#   docker compose --profile api up
#     -> additionally starts PostgreSQL and the FastAPI service on :8000.
#        Classifier is replay-only; matcher and guard run live on any
#        batch. Every run is saved to PostgreSQL and can be queried
#        through the /runs endpoints. (MongoDB is still supported: start
#        the `mongo` service and set MONGO_URL instead of DATABASE_URL.)
#
#   cd web && npm install && npm run dev
#     -> the dashboard on :5173, talking to the API on :8000.
#
services:
  agent:
    build: .
    image: recon-agent:latest
    # Inherits the Dockerfile CMD (python run.py).

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    profiles: ["api"]

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    profiles: ["mongo"]

  api:
    build: .
    image: recon-agent:latest
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    profiles: ["api"]

volumes:
  pg-data:
  mongo-data:
